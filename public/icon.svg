<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Definitions for Gradients and Glows -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#121118" />
      <stop offset="85%" stop-color="#07070a" />
      <stop offset="100%" stop-color="#020204" />
    </radialGradient>

    <!-- Outer Ring Glow -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6" />
    </linearGradient>

    <!-- Diya Lamp Gradient -->
    <linearGradient id="diyaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Outer Flame Gradient -->
    <linearGradient id="flameOuter" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Inner Core Flame Gradient -->
    <linearGradient id="flameCore" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield / Circle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#ringGrad)" stroke-width="1.5" />

  <!-- Ambient Light Aura -->
  <circle cx="32" cy="30" r="18" fill="#f59e0b" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Diya (Sacred Lamp Base) -->
  <path d="M16 39 C16 46 23 50 32 50 C41 50 48 46 48 39 C48 39 42 41 32 41 C22 41 16 39 16 39 Z" fill="url(#diyaGrad)" />
  <ellipse cx="32" cy="39" rx="16" ry="2.5" fill="#78350f" fill-opacity="0.6" />

  <!-- Outer Divine Flame -->
  <path d="M32 11 C32 11 41 22 41 31 C41 36.5 37 41 32 41 C27 41 23 36.5 23 31 C23 22 32 11 32 11 Z" fill="url(#flameOuter)" filter="url(#glow)" />

  <!-- Inner Sacred Luminous Flame -->
  <path d="M32 17 C32 17 38 25 38 32 C38 35.5 35.3 38.5 32 38.5 C28.7 38.5 26 35.5 26 32 C26 25 32 17 32 17 Z" fill="url(#flameCore)" />

  <!-- Bindu / Spark of Radiance -->
  <circle cx="32" cy="7.5" r="1.5" fill="#fef08a" />
</svg>
